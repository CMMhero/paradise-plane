name: i18n sync check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    paths:
      - "packages/i18n/**"
      - "apps/web/core/components/onboarding/**"
      - "apps/web/ce/components/onboarding/**"
      - ".github/workflows/i18n-sync-check.yml"
  push:
    branches:
      - "main"
    paths:
      - "packages/i18n/**"
      - "apps/web/core/components/onboarding/**"
      - "apps/web/ce/components/onboarding/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-check:
    name: check:sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Run sync check
        run: pnpm dlx tsx packages/i18n/scripts/sync-check.ts --ci

  onboarding-check:
    name: check:onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Install i18n package dependencies
        run: pnpm install --frozen-lockfile --filter @plane/i18n...

      # Fails on hardcoded user-facing text in onboarding components, missing or
      # untranslated keys, and dead onboarding_ui keys.
      - name: Run onboarding i18n guard
        run: pnpm --filter @plane/i18n run check:onboarding
