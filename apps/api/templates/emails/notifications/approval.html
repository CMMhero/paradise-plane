<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" >
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
    <style type="text/css" emogrify="no"> html { font-family: system-ui; } p, h1, h2, h3, h4, ol, ul { margin: 0; } a:hover { color: #3358d4 !important; } </style>
    <style type="text/css" emogrify="no"> @media (max-width: 600px) { .gmx-killpill { content: " \03D1"; } } </style>
  </head>
  <body bgcolor="#ffffff" text="#3b3f44" link="#006399" yahoo="fix" style="background-color: #f7f9ff; margin: 20px" >
    <div style=" width: 600px; table-layout: fixed; height: 100%; margin-left: auto; margin-right: auto; " >
      <div>
        <table style="width: 600px" cellspacing="0">
          <tr>
            <td>
              <div style="margin-left: 30px; margin-bottom: 20px; margin-top: 20px" > <div style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 0.2px; color: #1f2937; text-align: center; line-height: 1.3;">Paradise Task Tracker</div> </div>
            </td>
          </tr>
        </table>
      </div>
      <div style=" color: #1f2d5c; padding: 30px; border-radius: 4px; background-color: #fcfcfd; max-width: 100%; " >
        <div>
          <table style="width: 100%">
            <tr>
              <td>
                <p style="font-size: 1rem; color: #1f2d5c; font-weight: 600">{{ heading }}</p>
                <p style="font-size: 1rem; font-weight: 500; color: #1f2d5c; line-height: 28px"><a style="color: #1f2d5c; text-decoration: none;" target="_blank" href="{{ url_tugas }}">{{ label }}</a>: {{ judul }}</p>
              </td>
            </tr>
          </table>
          <hr style=" background-color: #f0f0f3; height: 1px; border: 0; margin-top: 15px; margin-bottom: 15px; " />
          <p style="font-size: 1rem; color: #1f2d5c; line-height: 28px">{{ intro }}</p>
          {% if tampilkan_alasan %}
          <div style="margin-top: 15px; padding: 12px 15px; border-left: 3px solid #dc2626; background-color: #fef2f2; border-radius: 0 4px 4px 0;">
            <p style="font-size: 0.85rem; color: #991b1b; font-weight: 600">{{ s.alasan_label }}</p>
            <p style="font-size: 1rem; color: #1f2d5c; line-height: 26px">{{ alasan }}</p>
          </div>
          {% endif %}
          <div style="margin-top: 20px; text-align: center;">
            <a target="_blank" href="{{ cta_url }}" style="display: inline-block; padding: 10px 24px; background-color: #3358d4; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 1rem; font-weight: 600;">{{ cta_label }}</a>
          </div>
          <hr style=" background-color: #f0f0f3; height: 1px; border: 0; margin-top: 20px; margin-bottom: 15px; " />
          <p style="font-size: 0.8rem; color: #6b7280; line-height: 22px">{{ kaki }}</p>
        </div>
      </div>
    </div>
  </body>
</html>
