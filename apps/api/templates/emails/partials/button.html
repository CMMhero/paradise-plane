{% comment %}Dua tombol yang harus kembar: VML untuk Outlook klasik (tinggi 40px, arcsize 20% = sudut 8px) dan <a> untuk klien lain (10px + 18px + 10px + border 2px = 40px, sudut 8px). Ubah salah satu, ubah keduanya.{% endcomment %}{% widthratio label|length 1 8 as lebar_teks %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td data-j="1" style="padding:4px 0 {{ r.blok }}px;" align="left">
<!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ url }}" style="height:40px;v-text-anchor:middle;width:{{ lebar_teks|add:"48" }}px;" arcsize="20%" {% if varian == 'kedua' %}strokecolor="{{ w.garis }}" strokeweight="1px" fillcolor="{{ w.permukaan }}"{% else %}stroke="f" fillcolor="{{ w.merek }}"{% endif %}><w:anchorlock/><center style="color:{% if varian == 'kedua' %}{{ w.teks }}{% else %}#ffffff{% endif %};font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:bold;text-decoration:none;">{{ label }}</center></v:roundrect><![endif]-->
<!--[if !mso]><!--><a class="em-tombol{% if varian == 'kedua' %}-kedua{% endif %}" href="{{ url }}" target="_blank" style="display:inline-block;padding:10px 22px;font-family:{{ font }};font-size:14px;line-height:18px;font-weight:700;text-decoration:none;border-radius:{{ sudut.tombol }}px;mso-hide:all;{% if varian == 'kedua' %}color:{{ w.teks }};background-color:{{ w.permukaan }};border:1px solid {{ w.garis }};{% else %}color:#ffffff;background-color:{{ w.merek }};border:1px solid {{ w.merek }};{% endif %}"><span style="text-decoration:none;{% if varian == 'kedua' %}color:{{ w.teks }};{% else %}color:#ffffff;{% endif %}">{{ label }}</span></a><!--<![endif]-->
</td></tr></table>
