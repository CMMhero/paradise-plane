worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------------------------------------
    # ATURAN CACHE. Sebelumnya TIDAK ADA sama sekali, dan itu menyebabkan galat
    # nyata di produksi: sesudah deploy, peramban yang tabnya masih terbuka
    # memakai `index.html` versi lama, yang menunjuk nama berkas chunk lama.
    # Chunk itu sudah tidak ada di image baru, jadi React gagal hidrasi dan
    # melempar error #418 dan #423, dan sebagian halaman berhenti bekerja
    # sampai orangnya memuat ulang dengan paksa.
    #
    # ⚠️ JEBAKAN NGINX: `add_header` di dalam `location` MENGHAPUS SELURUH
    # header yang diwarisi dari `server`. Jadi keempat header keamanan di atas
    # WAJIB ditulis ulang di tiap location yang memakai `add_header`. Kalau
    # tidak, `X-Frame-Options: DENY` hilang dan aplikasi bisa di-iframe orang.
    # ------------------------------------------------------------------------

    # Berkas ber-hash isi. Namanya berubah tiap kali isinya berubah, jadi ia
    # tidak akan pernah basi dan boleh disimpan selamanya. Diperiksa di
    # produksi: seluruh 1.109 berkas di sini ber-hash, nol yang tidak.
    location /assets/ {
      root   /usr/share/nginx/html;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker dan manifest TIDAK BOLEH disimpan. Service worker yang
    # basi menyajikan aplikasi versi lama walau server sudah diperbarui, dan
    # itu pernah membuat sebuah deploy terlihat gagal padahal berhasil.
    #
    # ⚠️ ATURAN INI MENAHAN BEBAN, JANGAN DIHAPUS WALAU BERKASNYA SUDAH TIDAK ADA.
    # `sw.js`, `workbox-*.js`, dan `manifest.json` memang sudah dibuang dari
    # repo. Justru karena itu aturan ini WAJIB tetap ada.
    #
    # Sebabnya: aturan ini sengaja TIDAK memakai `try_files`. Berkas yang tidak
    # ada dijawab 404 asli. Kalau aturan ini dihapus, permintaan jatuh ke
    # `location /` di bawah, yang `try_files`-nya menjawab index.html dengan
    # kode 200.
    #
    # Bedanya menentukan. Peramban yang masih memegang pendaftaran service
    # worker dari era Next.js dulu memeriksa `/sw.js` secara berkala. Menurut
    # spek Service Worker, pemeriksaan yang dijawab 404 MEMBATALKAN
    # pendaftarannya, dan itulah yang kita mau. Tapi jawaban 200 berisi HTML
    # bukan membatalkan apa pun: pembaruannya sekadar gagal, dan service worker
    # lamanya hidup terus selamanya, menyajikan `index.html` basi dari cache
    # tiap kali jaringan tersendat. Persis yang terjadi saat deploy.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.json|site\.webmanifest\.json)$ {
      root   /usr/share/nginx/html;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;

      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;

      # `no-cache` BUKAN berarti tidak disimpan: peramban tetap menyimpannya,
      # tapi WAJIB bertanya ke server sebelum memakainya. Jadi 304 yang murah
      # di pemakaian normal, dan berkas baru langsung terambil sesudah deploy.
      # Ini yang memutus rantai penyebab error hidrasi di atas.
      add_header Cache-Control "no-cache" always;
    }
  }
}
